name: Event Markov closure diagnostic

on:
  push:
    branches: [observatory-replication-20260815]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run diagnostic
        id: run
        continue-on-error: true
        env:
          PYTHONHASHSEED: '0'
        run: |
          mkdir -p build
          set +e
          python -m py_compile tools/replicate_action_field_observables.py tools/replicate_event_markov_closure.py > build/event-markov-debug.log 2>&1
          code=$?
          if [ $code -eq 0 ]; then
            python tools/replicate_event_markov_closure.py --seeds 1 --jobs 6 --output build/event-markov-debug.json >> build/event-markov-debug.log 2>&1
            code=$?
          fi
          echo "exit_code=$code" >> build/event-markov-debug.log
          exit 0
      - name: Persist diagnostic
        if: always()
        run: |
          mkdir -p experiment-results
          cp build/event-markov-debug.log experiment-results/event-markov-debug.log
          if [ -f build/event-markov-debug.json ]; then cp build/event-markov-debug.json experiment-results/event-markov-debug.json; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiment-results/event-markov-debug.*
          git commit -m 'Record event Markov closure diagnostic' || true
          git push
