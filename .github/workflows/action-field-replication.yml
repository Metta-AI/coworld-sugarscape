name: Action-field replication study

on:
  push:
    branches: [observatory-replication-20260815]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile studies
        run: |
          python -m py_compile tools/replicate_action_field_observables.py
          python -m py_compile tools/replicate_discrete_lagrangian.py
      - name: Run 3-seed-per-regime Lagrangian pilot
        env:
          PYTHONHASHSEED: '0'
        run: python tools/replicate_discrete_lagrangian.py --seeds 3 --jobs 6 --output build/discrete-lagrangian-pilot.json
      - name: Upload pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discrete-lagrangian-pilot
          path: build/discrete-lagrangian-pilot.json
          if-no-files-found: warn
      - name: Persist pilot on experiment branch
        if: success()
        run: |
          mkdir -p experiment-results
          cp build/discrete-lagrangian-pilot.json experiment-results/discrete-lagrangian-pilot.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiment-results/discrete-lagrangian-pilot.json
          git commit -m 'Record discrete Lagrangian pilot results'
          git push
