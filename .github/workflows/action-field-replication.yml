name: Action-field replication study

on:
  push:
    branches: [observatory-replication-20260815]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile studies
        run: |
          python -m py_compile tools/replicate_action_field_observables.py
          python -m py_compile tools/replicate_discrete_lagrangian.py
      - name: Run canonical 30-seed Lagrangian replications
        env:
          PYTHONHASHSEED: '0'
        run: python tools/replicate_discrete_lagrangian.py --seeds 30 --jobs 6 --output build/discrete-lagrangian-study.json
      - name: Upload study
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discrete-lagrangian-study
          path: build/discrete-lagrangian-study.json
          if-no-files-found: warn
      - name: Persist study on experiment branch
        if: success()
        run: |
          mkdir -p experiment-results
          cp build/discrete-lagrangian-study.json experiment-results/discrete-lagrangian-study.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiment-results/discrete-lagrangian-study.json
          git commit -m 'Record discrete Lagrangian replication results'
          git push
