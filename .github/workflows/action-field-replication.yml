name: Event Markov closure study

on:
  push:
    branches: [observatory-replication-20260815]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replicate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile study
        run: |
          python -m py_compile tools/replicate_action_field_observables.py
          python -m py_compile tools/replicate_event_markov_closure.py
      - name: Run corrected 4-seed-per-regime Markov closure study
        env:
          PYTHONHASHSEED: '0'
        run: python tools/replicate_event_markov_closure.py --seeds 4 --jobs 6 --output build/event-markov-closure-v2.json
      - name: Upload study
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-markov-closure-v2
          path: build/event-markov-closure-v2.json
          if-no-files-found: warn
      - name: Persist study on experiment branch
        if: success()
        run: |
          mkdir -p experiment-results
          cp build/event-markov-closure-v2.json experiment-results/event-markov-closure-v2.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiment-results/event-markov-closure-v2.json
          git commit -m 'Record corrected event Markov closure results'
          git push
