name: Export source for local study

on:
  push:
    branches: [classic-event-observatory-20260819]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: coworld-sugarscape-source-df78
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
      - name: Publish artifact locator
        run: |
          mkdir -p experiment-results
          printf '{"run_id":%s,"sha":"%s"}\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > experiment-results/source-export-run.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiment-results/source-export-run.json
          git commit -m 'Record source export run id' || true
          git push
