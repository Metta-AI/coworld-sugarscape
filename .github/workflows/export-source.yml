name: Export source for local study

on:
  push:
    branches: [classic-event-observatory-20260819]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: coworld-sugarscape-source-df78
          path: |
            .
            !.git/**
          include-hidden-files: true
          retention-days: 1
