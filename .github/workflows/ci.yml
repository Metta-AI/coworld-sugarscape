name: CI

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.5'
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.13'
          enable-cache: false
      - run: uv sync
      - name: Install qualified native study interpreters
        run: .venv/bin/python tools/setup_research.py
      - name: Run functional tests in parallel
        run: .venv/bin/python -m pytest -q -n auto -m "not perf"
      - name: Run performance tests serially
        run: .venv/bin/python -m pytest -q -m perf

  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint 1.7.12
        run: |
          mkdir -p build/tools
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output build/tools/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  build/tools/actionlint.tar.gz' | sha256sum --check
          tar -xzf build/tools/actionlint.tar.gz -C build/tools actionlint
      - run: build/tools/actionlint -color

  image-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - run: docker build --tag sugarscape-ci --file Dockerfile .
      - name: Check headless engine import
        run: >-
          docker run --rm --network none sugarscape-ci python -c
          "import sys; import coworld.dtl; assert 'tkinter' not in sys.modules"
      - name: Fetch hash-pinned native reference fixtures
        run: python3 tools/fetch_research_sources.py --kind fixtures
      - name: Run native Python reference episodes over the public protocol
        run: >-
          docker run --rm --network none sugarscape-ci
          python tools/research_experiments.py --out /tmp/python-proof
          --variant paper-mcculloch-4-7 --variant paper-carrella
          --variant paper-izquierdo-return-5 --variant paper-izquierdo-return-6
          --variant paper-dogan-fast --seeds 0
      - name: Run native NetLogo endpoint reference
        run: >-
          docker run --rm --network none sugarscape-ci
          python tools/research_experiments.py --out /tmp/oremland-proof
          --variant paper-oremland-phase-0-unclipped --seeds 1
      - name: Run native NetLogo trajectory smoke
        run: >-
          docker run --rm --network none sugarscape-ci
          python tools/research_experiments.py --out /tmp/brearcliffe-smoke
          --variant paper-brearcliffe-released-code-rule-m-ec
          --seeds 20261019 --timesteps 100
      - name: Qualify native Julia forward history over the public protocol
        run: >-
          docker run --rm --network none -v "$PWD/tests:/qualification:ro"
          sugarscape-ci python /qualification/verify_quera_system.py /tmp/quera-proof
