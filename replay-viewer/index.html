<style>/* Sugarscape broadcast — art direction lock.

   THE BOARD IS A DARK PLATE OF PACKED GRAINS. reference/dtl-python/gui.py is
   vendored in this repo and remains the oracle for the game's IDENTITY — the
   shared lattice, its two resources, agents coloured red then blue by decision
   model — but not for its rendering model, which was a white
   field of flat interpolated tiles. Two measured reasons it changed, and one
   asked for:

   1. The tile ramp carried quantity in CHROMA alone. Full sugar against an empty
      cell measures 1.07:1, so the gradient that is the whole point of the
      picture had no luminance signal end to end and read flat under any
      colour-vision deficiency, in greyscale, or on a projector.
   2. A near-white plate inside a #14100a surround is a glare sandwich: the
      brightest thing on the broadcast was bare ground.

   So resource is DENSITY: a dense mass of fine particles whose local
   concentration is the local amount — spice blown across a dune, not counters
   stacked in a square. The quantity now survives every channel the colour ramp
   lost it in, and the drifts run across cell boundaries the way real ones would.

   3. The two hues were 4.7:1 apart in LUMINANCE (#F2FA00 at L=0.872 against
      #9B4722 at L=0.115), so at equal coverage the yellow simply looked like
      more and the eye read a sugar majority the board did not have. Sugar is a
      warm white and spice a lit amber now — L=0.800 against L=0.478, close
      enough that equal masses read as equal masses. Hue says WHICH; density
      says how much.

   THE BROADCAST AROUND IT is a dark warm surround that seats the plate and never
   competes with it: ink #2a1f12, paper #f6ead2, sugar-gold accent #e8a838,
   nothing pure black or pure white. The plate has no luminance edge of its own
   against that surround, so its boundary is drawn as a lit warm rule rather than
   left to contrast. Seat colours are lifted from gui.py's palette so one value
   works both as a settler on the plate and as a chip on the panels. */

:root {
  color-scheme: dark;
  --ground: #14100a;
  --ink: #2a1f12;
  --paper: #f6ead2;
  --muted: #a8977c;
  --border: #4a3620;
  --panel: rgba(20, 15, 8, 0.86);
  --gold: #e8a838;
  --gold-wash: rgba(232, 168, 56, 0.16);
  --track-fill: #e8a838;
  --track-bed: #4a4034;
  --display: "Space Grotesk", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--ground);
  color: var(--paper);
  font-family: var(--display);
  overflow: hidden;
}

/* The embed frame is 16/9 and can be as short as 360px. The stage is letterboxed
   to exactly 16/9 inside it and everything - board, overlay, controls - lives in
   that one box, so the short hosted frame can never clip the broadcast off the
   top or starve the board of height. */
.frame { position: fixed; inset: 0; display: grid; margin: 0; }

/* Carries the broadcast as text for assistive technology. */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
  border: 0;
}
.stage {
  position: relative;
  margin: auto;
  aspect-ratio: 16 / 9;
  width: 100%;
  max-width: calc(100vh * 16 / 9);
  max-height: 100vh;
}

#board, #hud {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
#hud { pointer-events: none; }

/* Zero-data floating chrome. The container ignores pointer events so clicks fall
   through to the board; only the real controls take them back.

   The board scales with the frame, but the controls must not: sized purely in
   viewport units they collapsed to 20x17px at the 640x360 embed, under the
   24x24 CSS-px minimum target size. Every dimension below is a clamp with an
   accessible floor, so the chrome stays operable at the smallest embed and
   grows to comfortable at full size. */
/* The transport lives in its OWN LANE, reserved in broadcast.js by layoutStage.
   It used to float over the board: two lattice rows at 1280 and three at 640,
   where the pixel floors below bite while the board scales down, so the compact
   variant covered MORE of the primary read surface than the full-size one.

   The lane is measured in CSS PIXELS now rather than being a fixed 9.63% of the
   stage, because what the pill needs is a physical 34px and nothing else. The
   width below is likewise no longer the hardcoded 798/1920 = 41.6%: the board
   grows as the chrome around it shrinks, so layoutStage publishes its width as
   --board-width and this follows it. */
/* NO PILL. The transport sits in the empty lane UNDER the lattice.
 *
 * It used to be a bordered, blurred capsule floating over the board's bottom
 * edge — a plate laid across the one surface the broadcast exists to show, to
 * hold five controls that already read perfectly well on the ground. The lane
 * below the board was reserved for it all along and was sitting empty, so the
 * pill was occluding the lattice for no reason at all. Chrome removed; position
 * published by layoutStage as --transport-top so it tracks the board. */
.controls {
  position: absolute;
  left: var(--board-left, 1.6%);
  top: var(--transport-top, 92%);
  /* Set by layoutStage from the live BOARD.w; the fallback is the old fixed
     798 / 1920 in case the script has not laid out yet. */
  width: var(--board-width, 41.6%);
  min-width: 260px;
  max-width: calc(100% - 3.2%);
  display: flex;
  align-items: center;
  gap: clamp(4px, 0.7%, 9px);
  padding: 0 clamp(2px, 0.3%, 5px);
  pointer-events: auto;
}

.controls button {
  flex: none;
  min-width: clamp(24px, 2.2vw, 32px);
  height: clamp(24px, 2.2vw, 32px);
  padding: 0 clamp(4px, 0.7%, 9px);
  border: 1px solid transparent;
  border-radius: 999px;
  background: transparent;
  color: var(--paper);
  font: 600 clamp(11px, 1vw, 14px)/1 var(--mono);
  cursor: pointer;
}
.controls button:hover { background: var(--gold-wash); }
/* A control at its limit has to LOOK spent. text-size has been able to disable
   itself since syncLargeText landed and had no style to show for it, so a
   pressable-looking button sat there doing nothing; the lens hits its stops at
   1x and 8x every session. Dimmed rather than removed — where the lens runs out
   is part of what it tells you. */
.controls button:disabled { opacity: 0.38; cursor: default; }
.controls button:disabled:hover { background: transparent; }
/* The larger-text switch is a toggle, so it has to LOOK toggled — aria-pressed
   alone is invisible to everyone not using assistive technology. */
.controls button[aria-pressed="true"] {
  border-color: var(--gold);
  background: var(--gold-wash);
  color: var(--gold);
}
#text-size b { font-weight: 700; font-size: 1.24em; }
/* A real outline, not only a box-shadow: forced-colors mode drops shadows, and
   a focus ring that disappears there is no focus ring. */
.controls button:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 1px;
  border-color: var(--gold);
}

#scrub {
  flex: 1;
  min-width: 0;
  height: clamp(24px, 2.2vw, 32px);
  accent-color: var(--gold);
  cursor: pointer;
}
#scrub:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
  border-radius: 999px;
}
/* The pill's buttons were floored at the 24px minimum target; the range THUMB
   is a separate target and defaulted to 14px. */
#scrub { -webkit-appearance: none; appearance: none; background: transparent; }
#scrub::-webkit-slider-runnable-track {
  height: 6px;
  border-radius: 999px;
  background:
    var(--marks, none),
    linear-gradient(var(--track-fill), var(--track-fill)) left center / var(--played, 0%) 100% no-repeat,
    var(--track-bed);
}
#scrub::-moz-range-track {
  height: 6px;
  border-radius: 999px;
  background: var(--track-bed);
}
#scrub::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--track-fill); }
#scrub::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 24px;
  height: 24px;
  margin-top: -9px;
  border: 2px solid var(--ink);
  border-radius: 50%;
  background: var(--gold);
}
/* 24, not the 20 this used to carry: SC 2.5.8 measures the TARGET, and Firefox
   renders this thumb at exactly the size given. WebKit needs the negative
   margin to centre a thumb taller than its track; Gecko centres it itself. */
#scrub::-moz-range-thumb {
  width: 24px;
  height: 24px;
  border: 2px solid var(--ink);
  border-radius: 50%;
  background: var(--gold);
}

@media (forced-colors: active) {
  .controls { border-color: CanvasText; }
  .controls button:focus-visible,
  #scrub:focus-visible { outline-color: Highlight; }
}

/* Failure has to be visible, never a black box - and it has to look like this
   product rather than a bare fallback. */
.notice {
  position: absolute;
  inset: auto 12% 34%;
  margin: 0;
  padding: 1.4em 1.6em 1.5em;
  border: 1px solid var(--border);
  border-left: 3px solid var(--gold);
  border-radius: 6px;
  background: var(--panel);
  color: var(--paper);
  font: 500 clamp(12px, 1.6vw, 19px)/1.5 var(--display);
  backdrop-filter: blur(7px);
}
.notice::before {
  content: "SUGARSCAPE";
  display: block;
  margin-bottom: 0.5em;
  color: var(--paper);
  font: 700 clamp(13px, 1.7vw, 21px)/1 var(--display);
  letter-spacing: 0.26em;
}
.notice .hint {
  display: block;
  margin-top: 0.7em;
  color: var(--muted);
  font-size: 0.82em;
}
.notice code {
  font-family: var(--mono);
  color: var(--gold);
  overflow-wrap: anywhere;
}
/* fail() moves the focus here, so the ring has to be real and visible — it is
   the only thing on screen at that point. */
.notice:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}
.notice:empty { display: none; }
.controls[hidden] { display: none; }
/* Under the end card the scrim dims everything else; a full-brightness scrubber
   there reads as playback continuing under a final result. */
/* Under the end card the scrim dims everything else; a full-brightness scrubber
   there reads as playback continuing under a final result. But 0.34 took the
   glyphs to 2.81:1 and the slider to 2.04:1 — measured, against 4.5:1 and 3:1 —
   on controls that stay enabled and keyboard-reachable, at the moment the
   broadcast is most likely to be looked at. 0.72 still steps the pill back
   behind the result and keeps every control above AA. */
.controls.dimmed { opacity: 0.72; }
.controls.dimmed:hover, .controls.dimmed:focus-within { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  .controls, .notice { backdrop-filter: none; }
}

/* The target picker sits over the histogram panel's heading row. Its box is set
   in CSS px by placeTargetPicker from the panel's own stage coordinates, so it
   stays on the panel at any stage size rather than at a guessed percentage. */
.target-pick {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: auto;
  font: 600 clamp(9px, 0.62vw, 13px)/1 var(--mono, ui-monospace, monospace);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.target-pick[hidden] { display: none; }
.target-pick select {
  font: inherit;
  letter-spacing: 0.04em;
  text-transform: none;
  color: var(--paper);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 8px;
  max-width: 60%;
  cursor: pointer;
}
.target-pick select:hover { border-color: var(--gold); }
.target-pick select:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 2px;
}
</style>
</head>
<body>
<main class="frame">
  <h1 class="sr-only">Sugarscape replay</h1>

  <!-- The canvas and the SVG are one picture, and a picture cannot carry a
       standing. Both are hidden from assistive technology and the live region
       below carries the same information as text. -->
  <div class="stage" id="stage">
    <canvas id="board" width="1920" height="1080" aria-hidden="true"></canvas>
    <svg id="hud" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false"></svg>

    <!-- Which target the episode is read against. Real HTML rather than drawn
         into the SVG, because the HUD's markup is replaced on every timestep and
         that would close the menu under the pointer. Positioned over the
         histogram panel by placeTargetPicker, through the SVG's own coordinate
         transform, so it tracks the panel at any stage size. -->
    <label class="target-pick" id="target-pick" hidden>
      <span>read against</span>
      <select id="target-select" aria-label="Target to score this episode against"></select>
    </label>

    <div class="controls" id="controls" role="group" aria-label="Playback" hidden>
      <button id="play" type="button" aria-label="Pause">
        <span id="play-glyph" aria-hidden="true">&#10074;&#10074;</span>
      </button>
      <button id="step-back" type="button" aria-label="Previous timestep">
        <span aria-hidden="true">&#124;&#9664;</span>
      </button>
      <button id="step-forward" type="button" aria-label="Next timestep">
        <span aria-hidden="true">&#9654;&#124;</span>
      </button>
      <!-- The range's units are TIMESTEPS, so min/max/value and the announced
           valuetext all speak the same number. -->
      <input id="scrub" type="range" min="0" max="0" value="0" step="1"
             aria-label="Timestep" aria-valuetext="timestep 0">
      <button id="speed" type="button" aria-label="Playback speed, 1&times;">1&times;</button>
      <!-- The lens, with a HANDLE on it.
           Wheel-and-drag was the only way in, and a gesture with no affordance is
           a feature nobody finds — least of all inside the Observatory's iframe,
           where a wheel over the page is a scroll before it is a zoom. Two
           buttons say the lens exists; the wheel still does the fine work.
           Zooming out to 1x IS the fit, so there is no third "reset" button. -->
      <button id="zoom-out" type="button" aria-label="Zoom out">
        <span aria-hidden="true">&minus;</span>
      </button>
      <button id="zoom-in" type="button" aria-label="Zoom in">
        <span aria-hidden="true">&plus;</span>
      </button>
      <!-- The broadcast is drawn in SVG user units inside a fixed 16:9 embed, so
           a larger default font size cannot reach it and there is no reflow to
           fall back on. This is the in-product mechanism instead. -->
      <!-- The accessible name leads with the visible "AA" so speech input can
           reach it, and the pressed state is carried by aria-pressed alone
           rather than restated in the name. broadcast.js keeps both in sync and
           disables the control where it cannot help. -->
      <button id="text-size" type="button" aria-pressed="false" aria-label="AA, larger text">
        <span aria-hidden="true">A<b>A</b></span>
      </button>
    </div>

    <!-- tabindex so a failure can take the focus with it when it takes the
         transport away; see fail(). -->
    <p class="notice" id="notice" role="alert" tabindex="-1"></p>
  </div>

  <!-- The broadcast as text: standings, clock and the latest beat, announced
       politely as the episode advances. -->
  <p class="sr-only" id="commentary" aria-live="polite"></p>
  <p class="sr-only" id="verdict" aria-live="assertive"></p>
</main>
<script>
"use strict";

/* Sugarscape broadcast viewer.
 *
 * The whole broadcast lives in ONE 1920x1080 stage: a canvas board and an SVG
 * overlay share that coordinate space and scale together, so the short 16/9
 * hosted embed can never clip the scorebug off the top or starve the board of
 * height. Everything a viewer must READ is in the overlay; the floating HTML
 * carries only zero-data controls.
 *
 * The replay payload is `sugarscape.replay.v1`: a frame per recorded timestep
 * carrying the full sugar/spice/pollution lattice, every living agent, the
 * policy slots and the canonical aggregate statistics. Frames arrive either
 * over the spectator WebSocket (the container-backed path this ships on) or by
 * fetching an artifact named in `?replay=` (which is all a static bundle would
 * need). Nothing here mutates simulation state.
 */

// ---------------------------------------------------------------------------
// Theme — the Phase-0c art-direction lock, as tokens. Every colour the viewer
// paints comes from this block or from the gui.py port's own named constants
// (SUGAR_HEX / SPICE_HEX / PLATE_HEX / GRID_HEX); nothing below writes a colour
// literal inline.
// ---------------------------------------------------------------------------

const C = {
  ground: "#14100a",
  ink: "#2a1f12",          // the brand line; NEVER pure black
  paper: "#f6ead2",        // warm off-white; NEVER pure white
  muted: "#a8977c",
  dim: "#9c8b70",   // lifted twice: #6f6250 was 3.3:1, #8a7a62 passed by only 0.07
  border: "#4a3620",
  panel: "rgba(20,15,8,.86)",
  gold: "#e8a838",         // sugar — the world's own accent
  loss: "#e2703a",
  // Translucent surfaces, kept here rather than inline so the whole art
  // direction is still one block. Alpha is the point of each of these: they sit
  // over the board or over another panel and must let it through.
  card: "rgba(31,24,14,.985)",     // the end card's plate
  cardScrim: "rgba(10,7,4,.965)",  // full-stage dim behind the end card
  rowBack: "rgba(20,15,8,.72)",    // a result row inside the card
  wash: "rgba(246,234,210,.07)",   // the Lorenz square's fill
  hairline: "rgba(246,234,210,.34)",
  hairlineSoft: "rgba(246,234,210,.16)",
  // The equality diagonal is the whole POINT of a Lorenz chart - without it the
  // gold curve is an unreferenced squiggle - and it measured 1.84:1. C.muted is
  // 6.7:1 on the panel; a non-text graphic needs 3.
  guide: "#a8977c",               // the equality diagonal
  axis: "rgba(246,234,210,.42)",   // the chart's baseline, the strongest rule
  trackBed: "rgba(246,234,210,.14)",
  bugScrimTop: "rgba(12,9,5,.92)",
  bugScrimEnd: "rgba(12,9,5,0)",
  // Board-side values. The mat's shadow is warm rather than pure black, the
  // The plate is dark now, so its edge cannot be carried by luminance against a
  // dark surround: the mat is a lit warm rule rather than a shadow.
  mat: "rgba(20,12,4,.5)",
  edge: "#5c452a",
  // The surround, which is a place rather than a slab. See drawGround for why
  // there is a horizon behind the plate, why the corners fall away from it, and
  // why the far sand blowing over both is held this close to invisible.
  horizon: "rgba(126,86,36,.17)",
  horizonFar: "rgba(126,86,36,.06)",
  horizonOut: "rgba(126,86,36,0)",
  hollowIn: "rgba(8,5,2,0)",
  hollow: "rgba(8,5,2,.5)",
  dust: "rgba(246,234,210,.05)",     // far sand, lit by nothing
  dustWarm: "rgba(240,166,60,.05)",  // the same spice, a long way downwind
  // Not colours: the two ends of the alpha ramp that feathers a grain tile into
  // its neighbours. Here rather than inline so the block really is every literal.
  maskIn: "rgba(0,0,0,1)",
  maskOut: "rgba(0,0,0,0)",
};

// The original assigns palette colours to decision models in order
// (reference/dtl-python/gui.py: palette[0] red, palette[1] blue), so the two
// populations are red and blue exactly as in the model everyone recognises.
// Each hue is lifted slightly from the source so the same colour is legible
// BOTH as a dot on the white plate and as a chip on the dark broadcast panels,
// and each carries a redundant shape so the read never depends on hue alone.
//
// `text` is the second value, for the places a seat colour carries INK rather
// than filling a shape — the chart's pole label, the strip's head figures and
// the lead readout, which sit on the lead band itself where the chip hues
// measure 3.3-3.6:1. The chips themselves are used only as fills, where they
// are not text at all.
// (An earlier note here claimed the C.ink halo behind every label was the
// binding background. It is not: at three stage units the halo is a sub-pixel
// rim, and the surface underneath is the panel — darker than the ink, so the
// chips already cleared AA there. The lift is for the band.)
const SEATS = [
  // #f5504a on ink 4.69:1 -> #ff6b60 5.80:1
  { color: "#f5504a", text: "#ff6b60" },   // gui.py palette[0] #FA3232
  // #5a7cff on ink 4.40:1 (FAILS AA) -> #6b8bff 5.19:1
  { color: "#5a7cff", text: "#6b8bff" },   // gui.py palette[1] #3232FA
  { color: "#6bd47f", text: "#6bd47f" },   // palette[2] #32FA32, 8.7:1
  { color: "#52d6e8", text: "#52d6e8" },   // palette[3] #32FAFA, 9.3:1
];

const F = { display: "Space Grotesk", mono: "IBM Plex Mono" };

// ---------------------------------------------------------------------------
// Geometry — one 16:9 stage; the board top-inset derives from the scorebug
// height so the two can never overlap by construction.
// ---------------------------------------------------------------------------

const W = 1920;
const H = 1080;
const MAX_RENDER_SCALE = 1.5;
let renderScale = MAX_RENDER_SCALE;
const MARGIN = 30;
const BUG_H = 92;
// The clear space under the scorebug band. 22 was generous for a band whose type
// has since come down by a quarter.
const BAND_GAP = 12;
const KEY_H = 34;
/* The transport gets its OWN LANE, and the lane is measured in PIXELS.
 *
 * The floating pill is laid out in CSS percentages of the stage; the board is
 * laid out here in stage units; the two were never reconciled, so the pill sat
 * ON the board — two lattice rows at 1280, and THREE at 640, where its pixel
 * floors bite while the board scales down. The compact variant occluded more of
 * the primary read surface than the full-size one.
 *
 * What the pill actually needs is a physical 34 CSS px: a 24px minimum target
 * plus padding and border. As a CONSTANT 104 units that was right at the 640
 * floor and wrong everywhere above it — at 1280 it reserved 104 units for a pill
 * that needed 51, and the board paid the difference in every row of its lattice.
 * Derived from the live width it costs exactly what it needs at any size.
 */
const TRANSPORT_PX = 34;
const RAIL_GUTTER = 26;

/* The board is as big as the chrome will let it be, and the chrome is now honest
 * about what it costs.
 *
 * Every number this is made of used to be a constant tuned at one width, so the
 * board was fixed at 798 of 1080 units — 74% of the height and 42% of the width —
 * while the rail beside it took 54% of the width to hold three panels of short
 * text. Once the type became pixel-anchored the chrome around the board was
 * provably oversized at every width above the floor: the scorebug reserved a
 * fixed 92 units for two lines that had shrunk by a quarter, the key reserved its
 * own 34-unit row for one line of legend, and the transport reserved twice what
 * it needed. Reclaiming those puts ~30% more area under the lattice, which is the
 * thing the broadcast is actually about.
 *
 * Recomputed on every resize rather than at load, because all three of those
 * depend on the width the stage is being shown at. BOARD and RAIL are mutated in
 * place: everything downstream reads their fields at draw time. */
const BOARD = { x: MARGIN, y: 0, w: 0, h: 0 };
const RAIL = { x: 0, y: 0, w: 0, h: 0 };
let transportH = 104;
let keyH = KEY_H;

/* TWO COLUMNS: everything that READS on the left, the world itself on the right.
 *
 * The board used to sit left under a full-width scorebug band, with the panels
 * in a rail beside it. That band cost the board 124 units of height it did not
 * need — the masthead and the clock are text, and text belongs in the column of
 * text. Moving them into the left column lets the board start a key-row below
 * the top margin instead of below a whole band, and a board sized off the height
 * gets all of that back: 875 units to 949, which is 18% more area under the
 * lattice. On a 50x50 league board that is the difference between a gnome you
 * can read and a speck.
 *
 * The board is still SQUARE and still sized from the height, because the lattice
 * is square and the stage is wider than it is tall. The left column takes what
 * is left, which is ample for three panels of short text.
 */
function layoutStage() {
  const perPixel = unitsPerPixel();
  transportH = Math.max(44, Math.round(TRANSPORT_PX * perPixel));
  // The key is ONE LINE of legend and had a fixed 34-unit row for it, which is
  // the caption step plus 16 units of nothing at any width above the floor.
  keyH = Math.max(20, Math.round(T(18) * 1.12));
  BOARD.y = MARGIN + keyH;
  BOARD.w = H - BOARD.y - MARGIN - transportH;
  BOARD.h = BOARD.w;
  // Right column, flush to the stage margin.
  BOARD.x = W - MARGIN - BOARD.w;
  // Left column: masthead and clock at its top, panels filling the rest. It
  // keeps its full height because the transport belongs to the board only.
  RAIL.x = MARGIN;
  RAIL.y = BUG_H + BAND_GAP;
  RAIL.w = BOARD.x - RAIL_GUTTER - MARGIN;
  RAIL.h = H - RAIL.y - MARGIN;
  // The transport is laid out in CSS and must sit under the board it belongs to.
  // Both edges go over as custom properties; a hardcoded left was fine only while
  // the board was the left-hand column.
  document.documentElement.style.setProperty(
    "--board-width", `${(BOARD.w / W * 100).toFixed(2)}%`);
  document.documentElement.style.setProperty(
    "--board-left", `${(BOARD.x / W * 100).toFixed(2)}%`);
  // The transport's own lane, which sits UNDER the lattice rather than over it.
  // Centred in the reserved band so it is neither against the board nor the
  // stage edge.
  const laneTop = BOARD.y + BOARD.h + (transportH - TRANSPORT_PX * unitsPerPixel()) / 2;
  document.documentElement.style.setProperty(
    "--transport-top", `${(laneTop / H * 100).toFixed(2)}%`);
}

// ---------------------------------------------------------------------------
// Tempo. A speed label is an honest wall-clock multiplier over the complete
// 770ms beat. Motion itself remains capped at 3x through 4x; 8x and 16x snap to
// the latest due frame because their complete dwell is shorter than 150ms.
// ---------------------------------------------------------------------------

// The board's motion IS the product, so reduced motion does not disable it -
// it stops the replay auto-advancing, snaps between timesteps instead of
// interpolating, and drops the death rings. The viewer can still step and scrub.
//
// Read LIVE, not once at load. The preference is changed while pages are open -
// by a system accessibility toggle, by a browser setting, by an OS switching
// theme on a schedule - and a viewer that sampled it at boot kept animating for
// the rest of the session for someone who had just asked it to stop.
const motionQuery = typeof matchMedia === "function"
  ? matchMedia("(prefers-reduced-motion: reduce)")
  : null;
let reducedMotion = Boolean(motionQuery && motionQuery.matches);
if (motionQuery) {
  const onMotionChange = (event) => {
    reducedMotion = event.matches;
    // ONE direction only. Turning the preference on stops the replay at once,
    // which is the whole point. Turning it off used to force-START playback -
    // over an explicit pause, for anyone whose OS flips the setting on a
    // schedule. Resuming is the viewer's decision, not the media query's.
    if (reducedMotion && frameCount() > 0) {
      setPlaying(false);
      renderOnce();
    }
  };
  // Safari before 14 has no addEventListener on a MediaQueryList.
  if (typeof motionQuery.addEventListener === "function") {
    motionQuery.addEventListener("change", onMotionChange);
  } else if (typeof motionQuery.addListener === "function") {
    motionQuery.addListener(onMotionChange);
  }
}

const ANIM_MAX = 3;
const BASE_FRAME_MS = 620;
const READ_PAUSE = 150;
const NOMINAL_FRAME_MS = BASE_FRAME_MS + READ_PAUSE;
const END_HOLD_MS = 5200;
const MOTE_MS = 1500;
const SPEEDS = [0.5, 1, 2, 4, 8, 16];

// With ANIM_MAX at 2 both levers saturated there, so pressing 4x changed the
// label and nothing else. At 3 the dwell floor keeps shortening past 2x while
// motion still never plays faster than 3x real time.
function animFactor(speed) {
  return Math.max(1 / Math.max(speed, 0.05), 1 / ANIM_MAX);
}

/** How long to hold each timestep, including its reading beat. */
function frameDwellMs(speed) {
  return NOMINAL_FRAME_MS / Math.max(speed, 0.05);
}

function interpolatesAt(speed) {
  return frameDwellMs(speed) >= READ_PAUSE;
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

const board = document.getElementById("board");
const context = board.getContext("2d");
const hud = document.getElementById("hud");
const notice = document.getElementById("notice");
const controls = {
  container: document.getElementById("controls"),
  play: document.getElementById("play"),
  glyph: document.getElementById("play-glyph"),
  back: document.getElementById("step-back"),
  forward: document.getElementById("step-forward"),
  scrub: document.getElementById("scrub"),
  speed: document.getElementById("speed"),
  zoomOut: document.getElementById("zoom-out"),
  zoomIn: document.getElementById("zoom-in"),
  text: document.getElementById("text-size"),
};

/** Match backing pixels to what the embed can display, capped at the existing
 *  supersampling level. A 640px-wide stage no longer carries a 2880px bitmap. */
function syncBackingStores(stageWidth) {
  const density = typeof devicePixelRatio === "number" ? devicePixelRatio : 1;
  const nextScale = Math.min(MAX_RENDER_SCALE, stageWidth * density / W);
  if (!(nextScale > 0)) return;
  const width = Math.max(1, Math.round(W * nextScale));
  const height = Math.max(1, Math.round(H * nextScale));
  if (board.width === width && board.height === height && renderScale === nextScale) return;
  renderScale = nextScale;
  board.width = width;
  board.height = height;
  terrainShown = null;
}

const CHECKPOINT_EVERY = 32;
const MATERIALIZED_LIMIT = 3;
const FULL_FRAME_TAIL = 64;
const V1_AGENT_FIELDS = [
  "id", "cell", "slot", "age", "sugar", "spice", "sugarMetabolism",
  "spiceMetabolism", "vision", "movement", "depressed", "sick", "tribe", "race",
];

/** Select the narrowest typed array that preserves every JSON number exactly. */
function losslessNumericArray(values) {
  const integral = values.every(Number.isSafeInteger);
  if (integral && values.every((value) => value >= -32768 && value <= 32767)) {
    return Int16Array.from(values);
  }
  if (integral && values.every((value) => value >= -2147483648 && value <= 2147483647)) {
    return Int32Array.from(values);
  }
  if (values.every((value) => Number.isFinite(value) && Math.fround(value) === value)) {
    return Float32Array.from(values);
  }
  return Float64Array.from(values);
}

function defaultStats(runtime, timestep, population) {
  const stats = Object.assign({ timestep, population }, runtime || {});
  for (const key of ["giniCoefficient", "agentStarvationDeaths", "agentAgingDeaths",
    "agentCombatDeaths", "agentDiseaseDeaths"]) {
    if (stats[key] === undefined) stats[key] = 0;
  }
  return stats;
}

/** Packed, seekable replay storage. Only frameAt() crosses into renderer shape. */
class FrameStore {
  constructor() {
    this.count = 0;
    this.cache = new Map();
    this.summaries = [];
    this.events = [];
    this.wealthSeries = [];
    this.timestepIndex = new Map();
    this.mode = "empty";
    this.legacyDeltas = [];
    this.legacyMetadata = [];
    this.legacyCheckpoints = [];
    this.legacyTail = new Map();
    this.legacyStrings = [];
    this.legacyStringIds = new Map();
  }

  static fromV3(document_) {
    const store = new FrameStore();
    store.mode = "v3";
    const header = document_.header;
    const grid = header.initial_grid;
    store.width = grid.width;
    store.height = grid.height;
    store.config = header.config ?? {};
    store.scheduled = Number(store.config.timesteps ?? document_.frames.length);
    store.startingAgents = header.initial_agents.length;
    store.wealthQuantum = V3_WEALTH_QUANTUM;
    store.maxSugar = Math.max(0, ...grid.cells.map((cell) => Number(cell[3] ?? 0)));
    store.maxSpice = Math.max(0, ...grid.cells.map((cell) => Number(cell[4] ?? 0)));
    const players = store.config.players ?? [];
    const seatCount = Math.max(1, (header.targets ?? []).length);
    store.slots = Array.from({ length: seatCount }, (_, seat) => ({
      name: players[seat]?.name || `Seat ${seat + 1}`,
      decisionModels: [],
    }));
    store.targets = header.targets ?? [];
    store.finalScores = header.scores ?? [];

    const timesteps = [0];
    const stats = [null];
    const cellOffsets = [0];
    const cellIndices = [];
    const sugar = [];
    const spice = [];
    const pollution = [];
    const upsertOffsets = [0];
    const upserts = [];
    const removeOffsets = [0];
    const removes = [];
    const rosterRows = [...header.roster];
    const latest = new Map();
    const measuredNow = new Map();
    store.coworld = [];

    const coworld = () => {
      const seats = store.targets.map((target, seat) => {
        const reading = latest.get(seat) ?? {};
        const histogram = reading.histogram ?? {};
        const seatRow = {
          seat,
          name: store.slots[seat % store.slots.length].name,
          targetId: target.id,
          variable: target.variable,
          bins: target.bins ?? [],
          targetProbs: target.probs ?? [],
          measuredProbs: histogram.probs ?? [],
          sampleCount: histogram.sample_count ?? 0,
          measured: Boolean(histogram.probs),
          ...(reading.score !== undefined ? { score: reading.score } : {}),
          assigned: true,
        };
        if (target.kind) seatRow.targetKind = target.kind;
        if (reading.score_method) seatRow.scoreMethod = reading.score_method;
        if (reading.survivor_count !== undefined) seatRow.survivorCount = reading.survivor_count;
        if (reading.mean_wellness !== undefined) seatRow.meanWellness = reading.mean_wellness;
        if (reading.component_means) seatRow.componentMeans = reading.component_means;
        return seatRow;
      });
      return { seats, choices: targetChoices(header, measuredNow), finalScores: store.finalScores };
    };
    store.coworld.push(coworld());

    for (const [frameIndex, frame] of document_.frames.entries()) {
      timesteps.push(frame.timestep);
      stats.push(frame.runtimeStats ?? null);
      for (const row of frame.cell_deltas) {
        cellIndices.push(row[0]);
        sugar.push(row[1]);
        spice.push(row[2]);
        pollution.push(row[3]);
      }
      cellOffsets.push(cellIndices.length);
      for (const row of frame.agent_deltas.births) rosterRows.push(row);
      for (const row of frame.agent_deltas.upsert) upserts.push(...row);
      upsertOffsets.push(upserts.length / 7);
      for (const id of frame.agent_deltas.remove) removes.push(id);
      removeOffsets.push(removes.length);
      let changed = false;
      for (const reading of frame.running ?? []) {
        latest.set(reading.seat, reading);
        changed = true;
      }
      for (const [variable, histogram] of Object.entries(frame.measured ?? {})) {
        measuredNow.set(variable, histogram);
        changed = true;
      }
      if (frameIndex === document_.frames.length - 1) {
        for (const detail of header.seat_details ?? []) {
          latest.set(detail.seat, { ...(latest.get(detail.seat) ?? {}), ...detail });
          changed = true;
        }
      }
      store.coworld.push(changed ? coworld() : store.coworld.at(-1));
    }

    store.timesteps = Int32Array.from(timesteps);
    store.stats = stats;
    store.cellOffsets = Uint32Array.from(cellOffsets);
    store.cellIndices = Uint32Array.from(cellIndices);
    store.cellSugar = losslessNumericArray(sugar);
    store.cellSpice = losslessNumericArray(spice);
    store.cellPollution = losslessNumericArray(pollution);
    store.upsertOffsets = Uint32Array.from(upsertOffsets);
    store.upserts = losslessNumericArray(upserts);
    store.removeOffsets = Uint32Array.from(removeOffsets);
    store.removes = Uint32Array.from(removes);
    store.roster = losslessNumericArray(rosterRows.flat());
    store.rosterById = new Map();
    for (let offset = 0; offset < store.roster.length; offset += 9) {
      store.rosterById.set(store.roster[offset], offset);
    }
    store.initialCells = [0, 1, 2].map((plane) =>
      losslessNumericArray(grid.cells.map((cell) => cell[plane])));
    store.initialLive = losslessNumericArray(header.initial_agents.flat());
    store.count = timesteps.length;
    for (let index = 0; index < store.count; index += 1) {
      store.timestepIndex.set(store.timesteps[index], index);
    }
    store.buildCheckpoints();
    store.buildV3Derived();
    return store;
  }

  static fromV1(frames, config = {}) {
    const store = new FrameStore();
    store.mode = "v1";
    store.config = config;
    for (const frame of frames) store.appendFrame(frame);
    return store;
  }

  buildCheckpoints() {
    this.checkpoints = [];
    let cells = this.initialCells.map((plane) => plane.slice());
    let live = new Map();
    for (let offset = 0; offset < this.initialLive.length; offset += 7) {
      live.set(this.initialLive[offset], Array.from(this.initialLive.slice(offset, offset + 7)));
    }
    const save = (index) => {
      const rows = [...live.values()].sort((a, b) => a[0] - b[0]).flat();
      this.checkpoints.push({ index, cells: cells.map((plane) => plane.slice()), live: losslessNumericArray(rows) });
    };
    save(0);
    for (let index = 1; index < this.count; index += 1) {
      this.applyDelta({ index: index - 1, cells, live }, index);
      if (index % CHECKPOINT_EVERY === 0) save(index);
    }
    this.decoder = this.restoreCheckpoint(this.checkpoints[0]);
  }

  buildV3Derived() {
    const live = new Map();
    for (let offset = 0; offset < this.initialLive.length; offset += 7) {
      live.set(this.initialLive[offset], Array.from(this.initialLive.slice(offset, offset + 7)));
    }
    const sugar = Array(this.slots.length).fill(0);
    const spice = Array(this.slots.length).fill(0);
    const population = Array(this.slots.length).fill(0);
    const tribes = new Map();
    const adjust = (dynamic, direction) => {
      const rosterOffset = this.rosterById.get(dynamic[0]);
      const slot = rosterOffset === undefined ? 0 : this.roster[rosterOffset + 1];
      sugar[slot] = (sugar[slot] ?? 0) + direction * dynamic[3];
      spice[slot] = (spice[slot] ?? 0) + direction * dynamic[4];
      population[slot] = (population[slot] ?? 0) + direction;
      if (dynamic[5] >= 0) {
        const next = (tribes.get(dynamic[5]) ?? 0) + direction;
        if (next > 0) tribes.set(dynamic[5], next);
        else tribes.delete(dynamic[5]);
      }
    };
    for (const dynamic of live.values()) adjust(dynamic, 1);

    let lastLeader = -1;
    for (let index = 0; index < this.count; index += 1) {
      let lost = [];
      if (index > 0) {
        const delta = index - 1;
        for (let offset = this.removeOffsets[delta]; offset < this.removeOffsets[delta + 1]; offset += 1) {
          const dynamic = live.get(this.removes[offset]);
          if (!dynamic) continue;
          const rosterOffset = this.rosterById.get(dynamic[0]);
          const slot = rosterOffset === undefined ? 0 : this.roster[rosterOffset + 1];
          lost.push({ id: dynamic[0], cell: dynamic[1] * this.height + dynamic[2], slot });
        }
        for (let row = this.upsertOffsets[delta]; row < this.upsertOffsets[delta + 1]; row += 1) {
          const offset = row * 7;
          const dynamic = Array.from(this.upserts.slice(offset, offset + 7));
          const before = live.get(dynamic[0]);
          if (before) adjust(before, -1);
          live.set(dynamic[0], dynamic);
          adjust(dynamic, 1);
        }
        for (let offset = this.removeOffsets[delta]; offset < this.removeOffsets[delta + 1]; offset += 1) {
          const dynamic = live.get(this.removes[offset]);
          if (dynamic) adjust(dynamic, -1);
          live.delete(this.removes[offset]);
        }
      }
      const timestep = this.timesteps[index];
      const scores = sugar.map((value, slot) => Math.trunc(value + spice[slot]));
      const rows = this.slots.map((slot, seat) => ({
        index: seat,
        name: slot.name || `Population ${seat + 1}`,
        wealth: sugar[seat] + spice[seat],
        sugar: sugar[seat],
        spice: spice[seat],
        population: population[seat],
        score: scores[seat],
      }));
      const point = {
        timestep,
        scores: scores.slice(),
        sugar: sugar.slice(),
        spice: spice.slice(),
        population: population.slice(),
      };
      const stats = defaultStats(this.stats[index], timestep, live.size);
      this.wealthSeries.push(point);
      this.summaries.push({ rows, tribes: [...tribes], stats, coworld: this.coworld[index] });
      if (lost.length > 0) {
        const bySlot = new Map();
        for (const agent of lost) bySlot.set(agent.slot, (bySlot.get(agent.slot) ?? 0) + 1);
        this.events.push({
          index, timestep, kind: "death", count: lost.length,
          cause: deathCause({ stats }), bySlot: [...bySlot], agents: lost,
        });
      }
      const leader = leaderOf(scores);
      if (leader >= 0) {
        if (lastLeader >= 0 && lastLeader !== leader) {
          const rankedRows = rows.slice().sort((a, b) => b.score - a.score || a.index - b.index);
          this.events.push({
            index, timestep, kind: "lead", slot: leader, name: rows[leader].name,
            margin: rankedRows[0].score - (rankedRows[1]?.score ?? 0),
          });
        }
        lastLeader = leader;
      }
    }
  }

  restoreCheckpoint(checkpoint) {
    const live = new Map();
    for (let offset = 0; offset < checkpoint.live.length; offset += 7) {
      live.set(checkpoint.live[offset], Array.from(checkpoint.live.slice(offset, offset + 7)));
    }
    return { index: checkpoint.index, cells: checkpoint.cells.map((plane) => plane.slice()), live };
  }

  applyDelta(decoder, targetIndex) {
    if (targetIndex === 0) return;
    const delta = targetIndex - 1;
    for (let offset = this.cellOffsets[delta]; offset < this.cellOffsets[delta + 1]; offset += 1) {
      const cell = this.cellIndices[offset];
      decoder.cells[0][cell] = this.cellSugar[offset];
      decoder.cells[1][cell] = this.cellSpice[offset];
      decoder.cells[2][cell] = this.cellPollution[offset];
    }
    for (let row = this.upsertOffsets[delta]; row < this.upsertOffsets[delta + 1]; row += 1) {
      const offset = row * 7;
      const dynamic = Array.from(this.upserts.slice(offset, offset + 7));
      decoder.live.set(dynamic[0], dynamic);
    }
    for (let offset = this.removeOffsets[delta]; offset < this.removeOffsets[delta + 1]; offset += 1) {
      decoder.live.delete(this.removes[offset]);
    }
    decoder.index = targetIndex;
  }

  decoderAt(index) {
    if (this.decoder && index === this.decoder.index + 1) {
      this.applyDelta(this.decoder, index);
      return this.decoder;
    }
    if (this.decoder && index === this.decoder.index) return this.decoder;
    const checkpoint = this.checkpoints[Math.floor(index / CHECKPOINT_EVERY)];
    this.decoder = this.restoreCheckpoint(checkpoint);
    while (this.decoder.index < index) this.applyDelta(this.decoder, this.decoder.index + 1);
    return this.decoder;
  }

  materializeV3(index) {
    const decoder = this.decoderAt(index);
    const timestep = this.timesteps[index];
    const agents = [];
    for (const id of [...decoder.live.keys()].sort((a, b) => a - b)) {
      const dynamic = decoder.live.get(id);
      const offset = this.rosterById.get(id);
      const stat = offset === undefined ? [id, 0, 0, 0, 0, 0, 0, 0, -1]
        : Array.from(this.roster.slice(offset, offset + 9));
      agents.push({
        id,
        cell: dynamic[1] * this.height + dynamic[2],
        slot: stat[1],
        decisionModel: this.slots[stat[1] % this.slots.length].name,
        age: Math.max(0, timestep - stat[2]),
        sugar: dynamic[3],
        spice: dynamic[4],
        sugarMetabolism: stat[6],
        spiceMetabolism: stat[7],
        vision: stat[4],
        movement: stat[5],
        depressed: false,
        sick: Boolean(dynamic[6]),
        tribe: dynamic[5],
      });
    }
    const cells = Array.from({ length: decoder.cells[0].length }, (_, cell) => [
      decoder.cells[0][cell], decoder.cells[1][cell], decoder.cells[2][cell],
    ]);
    return {
      format: FRAME_FORMAT,
      timestep,
      maxTimestep: this.scheduled,
      environmentMaxSugar: this.maxSugar,
      environmentMaxSpice: this.maxSpice,
      startingAgents: this.startingAgents,
      wealthQuantum: this.wealthQuantum,
      width: this.width,
      height: this.height,
      cells,
      agents,
      links: [],
      slots: this.slots,
      stats: this.summaries[index].stats,
      final: index > 0 && index === this.count - 1,
      coworld: this.coworld[index],
    };
  }

  frameAt(index) {
    if (index < 0 || index >= this.count) return undefined;
    if (this.cache.has(index)) {
      const frame = this.cache.get(index);
      this.cache.delete(index);
      this.cache.set(index, frame);
      return frame;
    }
    const frame = this.mode === "v3" ? this.materializeV3(index)
      : this.legacyTail.get(index) ?? this.materializeLegacy(index);
    this.cache.set(index, frame);
    while (this.cache.size > MATERIALIZED_LIMIT) this.cache.delete(this.cache.keys().next().value);
    return frame;
  }

  timestepAt(index) { return this.timesteps?.[index] ?? this.legacyMetadata[index]?.timestep; }
  summaryAt(index) { return this.summaries[index]; }

  appendFrame(frame) {
    if (this.mode === "empty") this.mode = "v1";
    if (this.mode !== "v1") throw new Error("appendFrame accepts full-frame stores only");
    const existing = this.timestepIndex.get(frame.timestep);
    if (existing !== undefined) return this.replaceLegacy(existing, frame);
    return this.appendLegacy(frame);
  }

  legacyString(value) {
    const text = value === undefined ? "" : String(value);
    if (!this.legacyStringIds.has(text)) {
      this.legacyStringIds.set(text, this.legacyStrings.length);
      this.legacyStrings.push(text);
    }
    return this.legacyStringIds.get(text);
  }

  encodeLegacyAgents(agents) {
    const values = [];
    for (const agent of agents) {
      for (const field of V1_AGENT_FIELDS) {
        const value = agent[field];
        values.push(typeof value === "boolean" ? Number(value)
          : value === undefined ? Number.NaN : Number(value));
      }
      values.push(this.legacyString(agent.decisionModel), this.legacyString(agent.sex));
    }
    return losslessNumericArray(values);
  }

  decodeLegacyAgents(packed) {
    const agents = [];
    const width = V1_AGENT_FIELDS.length + 2;
    for (let offset = 0; offset < packed.length; offset += width) {
      const agent = {};
      for (let field = 0; field < V1_AGENT_FIELDS.length; field += 1) {
        const name = V1_AGENT_FIELDS[field];
        const value = packed[offset + field];
        if (Number.isNaN(value)) continue;
        agent[name] = name === "depressed" || name === "sick" ? Boolean(value) : value;
      }
      agent.decisionModel = this.legacyStrings[packed[offset + V1_AGENT_FIELDS.length]];
      const sex = this.legacyStrings[packed[offset + V1_AGENT_FIELDS.length + 1]];
      if (sex) agent.sex = sex;
      agents.push(agent);
    }
    return agents;
  }

  packLegacyCells(cells) {
    return [0, 1, 2].map((plane) => losslessNumericArray(cells.map((cell) => cell[plane])));
  }

  appendLegacy(frame) {
    const index = this.count;
    const metadata = {};
    for (const [key, value] of Object.entries(frame)) {
      if (key !== "cells" && key !== "agents") metadata[key] = value;
    }
    this.legacyMetadata.push(metadata);
    if (index === 0) {
      this.legacyBaseline = {
        cells: this.packLegacyCells(frame.cells),
        agents: this.encodeLegacyAgents(frame.agents),
      };
      this.legacyDeltas.push(null);
      this.legacyCheckpoints.push({ index: 0, ...this.legacyBaseline });
    } else {
      const previous = this.frameAt(index - 1);
      const changedCells = [];
      const cellValues = [[], [], []];
      for (let cell = 0; cell < frame.cells.length; cell += 1) {
        if (frame.cells[cell].some((value, plane) => value !== previous.cells[cell][plane])) {
          changedCells.push(cell);
          for (let plane = 0; plane < 3; plane += 1) cellValues[plane].push(frame.cells[cell][plane]);
        }
      }
      const previousAgents = new Map(previous.agents.map((agent) => [agent.id, agent]));
      const currentAgents = new Map(frame.agents.map((agent) => [agent.id, agent]));
      const changedAgents = frame.agents.filter((agent) => {
        const before = previousAgents.get(agent.id);
        return !before || V1_AGENT_FIELDS.some((field) => before[field] !== agent[field])
          || before.decisionModel !== agent.decisionModel || before.sex !== agent.sex;
      });
      const removed = previous.agents.filter((agent) => !currentAgents.has(agent.id)).map((agent) => agent.id);
      this.legacyDeltas.push({
        cellIndices: Uint32Array.from(changedCells),
        cells: cellValues.map(losslessNumericArray),
        agents: this.encodeLegacyAgents(changedAgents),
        removes: Uint32Array.from(removed),
      });
      if (index % CHECKPOINT_EVERY === 0) {
        this.legacyCheckpoints.push({
          index,
          cells: this.packLegacyCells(frame.cells),
          agents: this.encodeLegacyAgents(frame.agents),
        });
      }
    }
    this.timestepIndex.set(frame.timestep, index);
    this.legacyTail.set(index, frame);
    while (this.legacyTail.size > FULL_FRAME_TAIL) this.legacyTail.delete(this.legacyTail.keys().next().value);
    this.count += 1;
    this.rebuildDerived(Math.max(0, this.count - 2));
    return index;
  }

  replaceLegacy(existing, frame) {
    const suffix = [];
    for (let index = existing + 1; index < this.count; index += 1) suffix.push(this.frameAt(index));
    for (let index = existing; index < this.count; index += 1) {
      this.timestepIndex.delete(this.legacyMetadata[index].timestep);
      this.legacyTail.delete(index);
      this.cache.delete(index);
    }
    this.legacyMetadata.length = existing;
    this.legacyDeltas.length = existing;
    this.legacyCheckpoints = this.legacyCheckpoints.filter((checkpoint) => checkpoint.index < existing);
    this.count = existing;
    this.summaries.length = existing;
    this.wealthSeries.length = existing;
    this.events = this.events.filter((event) => event.index < existing);
    const replaced = this.appendLegacy(frame);
    for (const later of suffix) this.appendLegacy(later);
    return replaced;
  }

  materializeLegacy(index) {
    let checkpoint = this.legacyCheckpoints[0];
    for (const candidate of this.legacyCheckpoints) {
      if (candidate.index > index) break;
      checkpoint = candidate;
    }
    const cells = checkpoint.cells.map((plane) => plane.slice());
    const agents = new Map(this.decodeLegacyAgents(checkpoint.agents).map((agent) => [agent.id, agent]));
    for (let step = checkpoint.index + 1; step <= index; step += 1) {
      const delta = this.legacyDeltas[step];
      for (let offset = 0; offset < delta.cellIndices.length; offset += 1) {
        const cell = delta.cellIndices[offset];
        for (let plane = 0; plane < 3; plane += 1) cells[plane][cell] = delta.cells[plane][offset];
      }
      for (const id of delta.removes) agents.delete(id);
      for (const agent of this.decodeLegacyAgents(delta.agents)) agents.set(agent.id, agent);
    }
    return {
      ...this.legacyMetadata[index],
      cells: Array.from({ length: cells[0].length }, (_, cell) => [
        cells[0][cell], cells[1][cell], cells[2][cell],
      ]),
      agents: [...agents.values()].sort((a, b) => a.id - b.id),
    };
  }

  rebuildDerived(from) {
    if (from === 0) {
      this.summaries.length = 0;
      this.wealthSeries.length = 0;
      this.events.length = 0;
    } else {
      this.summaries.length = from;
      this.wealthSeries.length = from;
      this.events = this.events.filter((event) => event.index < from);
    }
    for (let index = from; index < this.count; index += 1) {
      const frame = this.frameAt(index);
      const rows = standings(frame);
      const point = {
        timestep: frame.timestep,
        scores: rows.map((row) => row.score),
        sugar: rows.map((row) => row.sugar),
        spice: rows.map((row) => row.spice),
        population: rows.map((row) => row.population),
      };
      this.wealthSeries[index] = point;
      const tribes = new Map();
      for (const agent of frame.agents) tribes.set(agent.tribe, (tribes.get(agent.tribe) ?? 0) + 1);
      this.summaries[index] = { rows, tribes: [...tribes], stats: frame.stats, coworld: frame.coworld };
      if (index === 0) continue;
      const previous = this.frameAt(index - 1);
      const living = new Set(frame.agents.map((agent) => agent.id));
      const lost = previous.agents.filter((agent) => !living.has(agent.id));
      if (lost.length > 0) {
        const bySlot = new Map();
        for (const agent of lost) bySlot.set(slotOf(agent), (bySlot.get(slotOf(agent)) ?? 0) + 1);
        this.events.push({
          index, timestep: frame.timestep, kind: "death", count: lost.length,
          cause: deathCause(frame), bySlot: [...bySlot],
          agents: lost.map((agent) => ({ id: agent.id, cell: agent.cell, slot: agent.slot })),
        });
      }
      const leader = leaderOf(point.scores);
      if (leader < 0) continue;
      let previousLeader = -1;
      for (let step = index - 1; step >= 0; step -= 1) {
        previousLeader = leaderOf(this.wealthSeries[step].scores);
        if (previousLeader >= 0) break;
      }
      if (previousLeader >= 0 && previousLeader !== leader) {
        const rankedRows = rows.slice().sort((a, b) => b.score - a.score || a.index - b.index);
        this.events.push({
          index, timestep: frame.timestep, kind: "lead", slot: leader,
          name: frame.slots[leader]?.name ?? `Population ${leader + 1}`,
          margin: rankedRows[0].score - (rankedRows[1]?.score ?? 0),
        });
      }
    }
  }
}

let frameStore = new FrameStore();
let events = frameStore.events;  // derived beats, in frame order
let wealthSeries = frameStore.wealthSeries;
const motes = [];                // transient death effects, in CELL coordinates

function frameCount() { return frameStore?.count ?? 0; }
function frameAt(index) { return frameStore?.frameAt(index); }
function firstFrame() { return frameAt(0); }
function lastFrame() { return frameAt(frameCount() - 1); }

const state = {
  streamId: null,
  cursor: 0,                     // fractional index into frames
  playing: true,
  speed: 1,
  live: false,                   // true while a live episode is still producing frames
  finished: false,
  maxTimestep: 0,
  maxSugar: 1,
  maxSpice: 0,
  maxWealth: 1,
  startingPopulation: 0,
  lastDrawnIndex: -1,
  holdUntil: 0,
  truncated: false,
  // Whether the very first timestep was seen. A spectator joining past the
  // server's live backlog cap has not, so "N of M survived" would be a fiction.
  sawStart: false,
  // The overlay scales with the stage, so at the 640x360 embed everything in the
  // rail shrinks by two thirds and a dozen small labels fall under 7px. Below
  // this width the rail sheds detail and sizes up instead of scaling down.
  compact: false,
  // The viewer's own "larger text" switch, which forces the compact ramp at any
  // size. See LARGE_TEXT below.
  largeText: false,
};

/* Density.
 *
 * The whole broadcast is drawn in a 1920-unit stage that is letterboxed into the
 * embed, so a stage unit is 1/3 of a CSS pixel at the 640x360 floor. A label set
 * at 18 units renders at SIX pixels there. Scaling every size by a constant did
 * not fix it: 18 x 1.28 is still 7.7px, and pushing the constant high enough to
 * clear 11px blew the panels apart because the BIG type grew by the same factor.
 *
 * So compact does not scale — it SWITCHES RAMPS. Five steps, with everything
 * below the caption step collapsing INTO it. The panels pay for that in content,
 * not in overflow: compact drops the Lorenz curve, the chart's axis annotations,
 * the crown, a feed row, and the scorebug's secondary line, and shortens
 * population names to their last word.
 *
 * THE RAMP IS IN CSS PIXELS, NOT STAGE UNITS, and that is the whole point of this
 * rewrite. It used to be five constants in stage units — 34, 40, 52, 66, 92 —
 * picked so the smallest landed at 11.3 CSS px at the 640 floor. But a stage unit
 * is 1/3 of a pixel at 640 and 1/1.64 of one at the 1174 switch-over, so those
 * same constants printed the caption at 11.3px at the floor and at 20.8px just
 * under the threshold, and the hero at 30.7px and 56px. The ramp was doing its
 * job at exactly one width and shouting everywhere else — which is what a stage
 * at 800 looked like: type built for a phone, rendered half again as large.
 *
 * Anchored to pixels it is the same physical size at every width in the band, and
 * it meets the sparse ramp exactly at DENSE_BELOW by construction rather than by
 * a constant that has to be re-tuned whenever the threshold moves.
 *
 *   caption 11.3px · label 13.3px · body 17.3px · figure 22px · hero 30.7px
 */
const COMPACT_PX = [
  [18, 11.3],       // caption
  [22, 13.3],       // label
  [30, 17.3],       // body
  [44, 22.0],       // figure
  [Infinity, 30.7], // hero
];

/** Stage units per CSS pixel at the width the stage is actually being shown at. */
function unitsPerPixel() {
  return W / Math.max(1, state.stageWidth || W);
}

/* The two reasons type gets bigger are NOT the same reason, and conflating them
 * broke the accessibility control.
 *
 * A SMALL STAGE needs a physical floor: whatever the width, nothing may print
 * below ~11 CSS px. That is a floor, so it does nothing once the stage is wide
 * enough to clear it on its own.
 *
 * A VIEWER ASKING FOR LARGER TEXT needs a multiplier: half again the design's own
 * size, at any width, including a 1600px stage that is nowhere near the floor.
 * Written as a floor it would have been a no-op at exactly the sizes where
 * someone reaching for it is most likely to be sitting — the control would have
 * silently done nothing on a desktop. */
const LARGE_TEXT_SCALE = 1.5;

/** Map a type size onto the current density's ramp. */
function T(size) {
  let mapped = size;
  if (state.compact) {
    const perPixel = unitsPerPixel();
    // Never BELOW the sparse size: compact exists to make small stages legible,
    // and a step that came out smaller than the size it replaced would be a
    // regression dressed as a ramp.
    for (const [limit, pixels] of COMPACT_PX) {
      if (size <= limit) { mapped = Math.max(size, pixels * perPixel); break; }
    }
  }
  return state.largeText ? mapped * LARGE_TEXT_SCALE : mapped;
}

/** Geometry that must stay proportional to the stage — a swatch, a dot radius, a
 *  rule's width. These do NOT take the type ramp: floored to a caption step a
 *  6-unit dot becomes a blob that eats the label beside it. Tracks the same
 *  pixel anchor as the type, so marks and labels shrink together. */
function G(size) {
  const mapped = state.compact ? size * Math.max(1, 1.34 * unitsPerPixel() / 3) : size;
  return state.largeText ? mapped * LARGE_TEXT_SCALE : mapped;
}

/** The advance to leave after a run of text set at `size`. The overlay lays its
 *  legend out by hand, so this has to track the REAL type size — a fixed
 *  per-character advance overlapped every label the moment the ramp changed. */
function advance(content, size) {
  return content.length * size * 0.56;
}

function dense() {
  return state.compact || state.largeText;
}

/* Where the two ramps meet.
 *
 * This was a bare `width < 900`, and it was a CLIFF rather than a floor: one
 * pixel above it the sparse ramp applied raw, so a 901-unit stage printed the
 * smallest label at 7.0 CSS px - worse than the 640 floor the compact ramp was
 * built to cure, and squarely in the 900-1300 band most article embeds live in.
 *
 * The threshold is not a taste call, it is arithmetic. The smallest size the
 * sparse ramp carries is MIN_SPARSE units on a 1920-unit stage, so it clears
 * MIN_TYPE_PX only once the stage is MIN_SPARSE / MIN_TYPE_PX * 1920 wide.
 * Below that width the compact ramp takes over, which is always LARGER, never
 * smaller. Both sides of the switch are legible; only the content differs.
 */
const MIN_TYPE_PX = 11;
const MIN_SPARSE = 18;
const DENSE_BELOW = Math.ceil((MIN_TYPE_PX / MIN_SPARSE) * W);   // 1174

function measureDensity() {
  const width = document.getElementById("stage").getBoundingClientRect().width;
  const compact = width > 0 && width < DENSE_BELOW;
  // The width itself is now a live input, not just the side that chose the ramp:
  // the compact steps are pixel-anchored, so every T() and G() reads it.
  const moved = width > 0 && width !== state.stageWidth;
  if (width > 0) state.stageWidth = width;
  if (moved) layoutStage();
  if (width > 0) syncBackingStores(width);
  if (compact === state.compact) {
    if (moved) {
      standingsSignature = "";
      beatsSignature = "";
      terrainShown = null;
    }
    return;
  }
  state.compact = compact;
  syncLargeText();
  standingsSignature = "";
  beatsSignature = "";
}

/** Reflect the switch honestly, INCLUDING when it can do nothing.
 *
 *  Below DENSE_BELOW the compact ramp is already in force and is already the
 *  largest this viewer has, so pressing the button changed not one pixel — while
 *  it still reported `aria-pressed="true"` and announced "Larger text, on". A
 *  control that announces a state change it cannot deliver is worse than no
 *  control. It says so instead, and the name leads with the visible glyphs so
 *  speech input can reach it (SC 2.5.3); the state comes from aria-pressed
 *  alone, rather than being announced twice. */
function syncLargeText() {
  const inert = state.compact;
  controls.text.disabled = inert;
  controls.text.setAttribute("aria-pressed", state.largeText ? "true" : "false");
  controls.text.setAttribute(
    "aria-label",
    inert
      ? "AA, larger text — already at the largest size this embed can show"
      : "AA, larger text",
  );
  controls.text.setAttribute(
    "title",
    inert
      ? "This embed is already showing the largest type this viewer has."
      : "Larger text — sets the broadcast in a bigger type ramp and drops the"
        + " finer annotations to make room",
  );
}

/* Larger text.
 *
 * WCAG 1.4.4 asks that text scale to 200% without loss. Full-page zoom does
 * scale this broadcast — the stage is letterboxed into the viewport, so zooming
 * the host page magnifies the whole thing, text included, with nothing lost. But
 * TEXT-ONLY resizing (a larger default font size) cannot reach type expressed in
 * SVG user units, and the embed's aspect ratio is fixed by the host, so there is
 * no reflow to fall back on. This switch is the in-product mechanism instead: it
 * forces the compact ramp at any size, which is a ~1.5x type increase, and it is
 * remembered for the session. The trade is stated on the button's own title. */
const LARGE_TEXT = "sugarscape.broadcast.largeText";

function setLargeText(on) {
  state.largeText = on;
  syncLargeText();
  try {
    if (on) sessionStorage.setItem(LARGE_TEXT, "1");
    else sessionStorage.removeItem(LARGE_TEXT);
  } catch (error) {
    // A sandboxed iframe can deny storage entirely; the toggle still works, it
    // just does not persist. Never let that throw and take the overlay with it.
  }
  standingsSignature = "";
  beatsSignature = "";
  renderOnce();
}


// ---------------------------------------------------------------------------
// Frame ingestion + derived model
// ---------------------------------------------------------------------------

const FRAME_FORMAT = "sugarscape.frame.v1";
let rejectedFormat = false;
let rejectedShape = false;

/** The server stamps a format on every frame. Checking only that `cells` is an
 *  array let a future shape through to throw on every tick behind a fully
 *  populated HUD - confidently wrong, which is worse than a black box. */
function isRenderableFrame(frame) {
  if (!frame || typeof frame !== "object") return false;
  if (typeof frame.format === "string" && frame.format !== FRAME_FORMAT) {
    if (!rejectedFormat) {
      rejectedFormat = true;
      fail(`This episode is recorded as ${frame.format}, which this viewer cannot read.`);
    }
    return false;
  }
  const shaped = Array.isArray(frame.cells) && Array.isArray(frame.agents)
    && Array.isArray(frame.slots) && Array.isArray(frame.cells[0])
    && Number.isFinite(frame.width) && Number.isFinite(frame.height)
    && Number.isFinite(frame.timestep);
  // Say WHICH way it was unusable. Letting these fall through to the silence
  // timer told an operator debugging a slot-config bug that nothing was being
  // sent, when five frames a second were arriving and being discarded.
  if (!shaped) {
    if (!rejectedShape) {
      rejectedShape = true;
      fail("This episode is sending frames this viewer cannot read.");
    }
    return false;
  }
  if (frame.slots.length === 0) {
    if (!rejectedShape) {
      rejectedShape = true;
      fail("This episode declares no policy populations, so there is no standing to show.");
    }
    return false;
  }
  return true;
}

/** A seat's colours. The manifest permits up to 16 populations while the
 *  palette lists four, so this cycles rather than returning undefined: indexing
 *  SEATS raw threw on the fifth population and blanked the whole overlay, and
 *  silently dropped those populations' wealth from every total. */
function seatOf(index) {
  return SEATS[((index % SEATS.length) + SEATS.length) % SEATS.length];
}

function slotOf(agent) {
  return agent.slot >= 0 ? agent.slot : -1;
}

/** Per-population standing. The score axis is total living wealth, matching
 *  `buildResults` in coworld.nim (which truncates the float sum to an integer);
 *  population count is the visible race but NOT the score. */
function standings(frame) {
  const rows = frame.slots.map((slot, index) => ({
    index,
    name: slot.name || `Population ${index + 1}`,
    wealth: 0,
    sugar: 0,
    spice: 0,
    population: 0,
  }));
  for (const agent of frame.agents) {
    const row = rows[slotOf(agent)];
    if (!row) continue;
    // Kept apart as well as summed. The score is the sum and only the sum, but
    // the lead plot stacks the two, and WHICH resource a lead is made of is a
    // different fact from how big it is: a population can be ahead overall while
    // behind on one of them. On the shipped recording that happens on 9.5% of
    // timesteps, and for the first 25 it is nearly the whole story.
    row.sugar += agent.sugar;
    row.spice += agent.spice;
    row.wealth += agent.sugar + agent.spice;
    row.population += 1;
  }
  for (const row of rows) row.score = Math.trunc(row.wealth);
  return rows;
}

/** True when the head of the episode was never delivered. The game server keeps
 *  a bounded backlog for live spectators, so joining a long episode late yields
 *  a stream that opens partway through — every total derived from "since the
 *  start" is then a window, and the broadcast has to say which. */
function joinedLate() {
  return !state.sawStart && frameCount() > 0 && firstFrame().timestep > 0;
}

function ranked(frame) {
  return standings(frame)
    .slice()
    .sort((first, second) => second.score - first.score || first.index - second.index);
}

/** The engine ships a per-frame count for each death cause. Saying "starved"
 *  for every disappearance is right for the shipping variant and wrong the
 *  moment aging, combat or disease is enabled - so read the cause rather than
 *  assume it. */
function deathCause(frame) {
  const stats = frame.stats ?? {};
  const causes = [
    ["starved", Number(stats.agentStarvationDeaths ?? 0)],
    ["died of age", Number(stats.agentAgingDeaths ?? 0)],
    ["killed in combat", Number(stats.agentCombatDeaths ?? 0)],
    ["lost to disease", Number(stats.agentDiseaseDeaths ?? 0)],
  ].sort((first, second) => second[1] - first[1]);
  return causes[0][1] > 0 ? causes[0][0] : "lost";
}

function leaderOf(scores) {
  if (!Array.isArray(scores) || scores.length === 0) return -1;
  let best = 0;
  for (let slot = 1; slot < scores.length; slot += 1) {
    if (scores[slot] > scores[best]) best = slot;
  }
  const shared = scores.some((score, slot) => slot !== best && score === scores[best]);
  return shared ? -1 : best;
}

function recordFrame(frame) {
  if (state.streamId !== null && frame.streamId !== undefined
      && frame.streamId !== state.streamId) {
    resetStream();
  }
  if (frame.streamId !== undefined) state.streamId = frame.streamId;

  const replacing = frameStore.timestepIndex.has(frame.timestep);
  const index = frameStore.appendFrame(frame);
  events = frameStore.events;
  wealthSeries = frameStore.wealthSeries;

  if (frame.timestep === 0) state.sawStart = true;
  /* The world's SCALE comes from the server, not from the window in hand.
   *
   * Both of these used to be inferred - a running maximum over whatever cells
   * and agents had arrived - under a comment claiming that solved the
   * partly-eaten-world problem. It did not; it normalised against a partly-eaten
   * world with extra steps, and the population line was strictly worse: it took
   * the largest headcount ever SEEN, which is the exact "32 of 36 survived"
   * fiction the comment beside it warned about, and which any variant with
   * reproduction turns from latent into wrong. The server stamps
   * environmentMaxSugar, environmentMaxSpice and startingAgents on every frame
   * now, so read them; the inference is only a fallback for an older server, and
   * it no longer claims to have seen the start. */
  const declaredSugar = Number(frame.environmentMaxSugar ?? 0);
  const declaredSpice = Number(frame.environmentMaxSpice ?? 0);
  if (declaredSugar > 0) state.maxSugar = declaredSugar;
  if (declaredSpice > 0) state.maxSpice = Math.max(state.maxSpice, declaredSpice);
  const declaredAgents = Number(frame.startingAgents ?? 0);
  if (declaredAgents > 0) {
    state.startingPopulation = declaredAgents;
  } else if (frame.timestep === 0 || state.startingPopulation === 0) {
    // No declaration: frame zero is authoritative, and anything else is a guess
    // that must not be presented as a denominator - see sawStart.
    state.startingPopulation = frame.agents.length;
  }
  if (declaredSugar <= 0 || declaredSpice <= 0) {
    for (const cell of frame.cells) {
      if (declaredSugar <= 0 && cell[0] > state.maxSugar) state.maxSugar = cell[0];
      if (declaredSpice <= 0 && cell[1] > state.maxSpice) state.maxSpice = cell[1];
    }
  }
  // maxTimestep is stamped on every frame by the game server so the clock counts
  // to the SCHEDULED end of the match, not to whatever tick this recording
  // happens to stop at. An early extinction then freezes short of the buzzer.
  if (typeof frame.maxTimestep === "number") {
    state.maxTimestep = Math.max(state.maxTimestep, frame.maxTimestep);
  }
  state.maxTimestep = Math.max(state.maxTimestep, frame.timestep);

  const rows = frameStore.summaryAt(index).rows;
  if (replacing) {
    state.maxWealth = Math.max(1, ...wealthSeries.flatMap((point) => point.scores));
    if (declaredSugar <= 0 || declaredSpice <= 0) {
      state.maxSugar = declaredSugar > 0 ? declaredSugar : 1;
      state.maxSpice = declaredSpice > 0 ? declaredSpice : 0;
      for (let step = 0; step < frameCount(); step += 1) {
        for (const cell of frameAt(step).cells) {
          if (declaredSugar <= 0) state.maxSugar = Math.max(state.maxSugar, cell[0]);
          if (declaredSpice <= 0) state.maxSpice = Math.max(state.maxSpice, cell[1]);
        }
      }
    }
    standingsSignature = "";
    terrainShown = null;
  } else {
    for (const row of rows) state.maxWealth = Math.max(state.maxWealth, row.score);
  }

  syncScrub();
  if (state.live && state.playing) state.cursor = frameCount() - 1;
  if (state.live && state.playing) startPaintLoop();
  else if (state.live) renderOnce();
}

function resetStream() {
  stopPaintLoop();
  frameStore = new FrameStore();
  events = frameStore.events;
  wealthSeries = frameStore.wealthSeries;
  motes.length = 0;
  // A crossfade is remembered by AGENT ID, and a new stream starts its ids over
  // from zero: without this, the first settlers of the next episode inherit the
  // last one's half-finished sways and open a pulse nothing on the board caused.
  swayLog.clear();
  state.cursor = 0;
  setPlaybackPhase(0);
  state.maxWealth = 1;
  state.maxSugar = 1;
  state.maxSpice = 0;
  state.maxTimestep = 0;
  state.startingPopulation = 0;
  state.sawStart = false;
  state.holdUntil = 0;
  terrainShown = null;
  state.finished = false;
  state.truncated = false;
  rejectedFormat = false;
  rejectedShape = false;
  notice.textContent = "";
  state.lastDrawnIndex = -1;
  spokenKey = "";
  spokenVerdict = false;
  lastSpokenAt = -Infinity;
  markedLeads = -1;
  standingsSignature = "";
  beatsSignature = "";
  controls.scrub.min = "0";
  controls.scrub.max = "0";
  controls.scrub.value = "0";
}

// ---------------------------------------------------------------------------
// Terrain — composited once per timestep into an offscreen canvas, because it
// only changes when the frame does, while agents move every animation tick.
// ---------------------------------------------------------------------------

/* The board is a faithful rebuild of the DTL Sugarscape plate.
 *
 * The original renderer is vendored in this repo at reference/dtl-python/gui.py
 * and it is the oracle for the LOOK, exactly as the Python model is the oracle
 * for behaviour. It draws a white canvas, one rectangle per cell outlined in
 * #c0c0c0, filled by interpolating white -> #F2FA00 with sugar and -> #9B4722
 * with spice, and plain filled circles for agents coloured by decision model.
 *
 * An earlier pass here invented a warm painterly massif with generated terrain
 * textures, a relief pass and contours. It buried the per-cell resource under
 * texture, read as fog, and looked nothing like the model anyone recognises.
 * The lattice IS the picture; it does not want scenery. */

/* The two resources are matched for BRIGHTNESS, not just separated by hue.
 *
 * gui.py's #F2FA00 sugar and #9B4722 spice measure L=0.872 and L=0.115 — a 4.7:1
 * luminance gap between the two things the viewer is being asked to compare. At
 * equal coverage the yellow simply looked like more, so the eye read a sugar
 * majority on a board that did not have one. Sugar is a warm white and spice a
 * lit amber now: L=0.800 against L=0.478, a 1.5:1 gap, close enough that equal
 * masses read as equal masses. Hue says WHICH resource; density says how much.
 */
const SUGAR_HEX = "#f4ecdb";          // warm white; NEVER pure
const SPICE_HEX = "#f0a63c";          // the amber of the spice itself
const PLATE_HEX = "#1d1811";          // the field the grains lie on; NEVER pure black
const GRID_HEX = "#332a1e";           // one step up from the plate

let terrainShown = null;
const terrain = document.createElement("canvas");
const terrainContext = terrain.getContext("2d");

function sameTerrain(first, second) {
  if (!first || !second || first.width !== second.width || first.height !== second.height
      || first.environmentMaxSugar !== second.environmentMaxSugar
      || first.environmentMaxSpice !== second.environmentMaxSpice
      || first.cells.length !== second.cells.length) return false;
  for (let index = 0; index < first.cells.length; index += 1) {
    if (first.cells[index][0] !== second.cells[index][0]
        || first.cells[index][1] !== second.cells[index][1]) return false;
  }
  return true;
}

/** Cache the countable resource layer until its data or geometry changes. */
function showTerrain(frame) {
  if (sameTerrain(frame, terrainShown)) {
    terrainShown = frame;
    return false;
  }
  terrainShown = frame;
  buildTerrain(frame);
  return true;
}

/** `value` brought into [0, span) — the cell wraps, so a grain that orbits off
 *  one edge comes back on the other rather than being clipped away. */
function wrapInto(value, span) {
  return ((value % span) + span) % span;
}

/** A deterministic value in [0,1) from three integers. Positions must be stable
 *  across timesteps or the whole plate boils when one settler eats one unit. */
function stableOffset(a, b, c) {
  let hash = (a * 73856093) ^ (b * 19349663) ^ (c * 83492791);
  hash = Math.imul(hash ^ (hash >>> 15), 2246822507);
  hash = Math.imul(hash ^ (hash >>> 13), 3266489909);
  return ((hash ^ (hash >>> 16)) >>> 0) / 4294967296;
}

/* COUNTABLE DOTS, one per unit held. A tile carries up to four of each.
 *
 * This replaces the sand cloud, and the reason the cloud existed no longer
 * holds. The cloud drew many particles per unit and let local DENSITY carry the
 * amount; one-dot-per-unit had been tried before it and rejected, because on a
 * 50x50 board a cell is about fourteen pixels and four dots inside that is a
 * speckle the eye cannot integrate into a massif.
 *
 * v3's world is 20x20. The same board gives a cell roughly six times the area,
 * which is the measurement that changed — enough room to lay eight dots out on
 * fixed slots and still see plate between them. So the amount is now exactly
 * what it is in the model: a count you can point at, not a texture you estimate.
 * Density was always a proxy for counting; at this cell size we can just count.
 *
 * Sugar takes the square, spice takes the diamond. Two interleaved lattices that
 * never collide, so a tile holding four of each reads as four and four rather
 * than as eight of something. Slots fill in a fixed order, so one more unit is
 * one more dot in a place the eye already knows to look.
 */
const DOT_RADIUS = 0.055;   // of a cell
const DOT_HALO = 0.016;     // plate-coloured rim so touching dots stay separate
/* Each cell gets its OWN scattered layout, not a shared lattice.
 *
 * The first attempt kept one fixed constellation — sugar on a square, spice on a
 * diamond — and nudged each dot off it. That still printed a pattern, and the
 * arithmetic says why: the nudge was 0.038 of a cell against a slot spacing of
 * 0.40, about two pixels at the size these draw. Every cell repeated the same
 * motif in the same places, so the eye read the repeat straight through the
 * jitter, and dots stayed aligned in columns across neighbouring cells.
 *
 * So the positions themselves are drawn per cell now, by rejection sampling
 * against a minimum separation: genuinely irregular placement, with the gap that
 * keeps every dot a countable mark preserved as a CONSTRAINT rather than as a
 * consequence of sitting on a grid. Deterministic — hashed off the cell index,
 * never Math.random — because the plate repaints every tick and anything drawn
 * fresh each time would boil. Cached, because rejection sampling per repaint
 * would be wasted work for an answer that never changes.
 */
const DOT_MARGIN = 0.085;   // keep a whole dot inside its own cell
const DOT_MIN_GAP = 0.20;   // centre-to-centre, comfortably over the dot span
const DOT_TRIES = 48;
const dotLayouts = new Map();
